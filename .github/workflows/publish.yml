name: Publish

# Publishes a tagged release to Modrinth, CurseForge, and a GitHub Release.
#
# Trigger: push a tag matching v* (see the Publishing section of README.md
# for the full human runbook: creating the two store projects, minting the
# two tokens, and setting the two repository variables this workflow reads).
# The job can also be started from the Actions tab with a tag name, for
# re-publishing after the tokens are added.
#
# Kir-Antipov/mc-publish was renamed upstream; the project now lives at
# Kira-NT/mc-publish (same action, same maintainer, verified via the GitHub
# API on 2026-09-09: Kir-Antipov/mc-publish resolves to full_name
# "Kira-NT/mc-publish"). This workflow uses the current name.
#
# mc-publish skips a platform cleanly, with no failure, when that platform's
# token input is empty (confirmed in its README's "Token Behavior" notes),
# so this single job works whether one or both of MODRINTH_TOKEN and
# CURSEFORGE_TOKEN secrets are set.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Matches the Java toolchain build.gradle.kts actually targets
      # (options.release.set(25), sourceCompatibility/targetCompatibility
      # VERSION_25) and the version ci.yml's build/test jobs already use.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: gradle build
        run: ./gradlew build

      - name: Publish to Modrinth, CurseForge, and GitHub Releases
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Default files glob (build/libs/!(*-@(dev|sources|javadoc)).jar)
          # already picks the main jar and excludes the sources jar this
          # build produces alongside it, so it is left unset here.
          game-versions: 26.2
          loaders: fabric
          dependencies: fabric-api(required)
          version-type: beta
          changelog-file: docs/listing/changelog.md
          java: 25
