# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Minecraft 26.2 ships unobfuscated and no Yarn mappings are published for it.
# Loom does NOT detect this automatically from the Minecraft version; this flag
# is required or the build fails with "Configuration 'mappings' has no dependencies".
fabric.loom.disableObfuscation=true

# Mod Properties
version=0.1.1
group=app.seedscout.nav

# Dependencies
fabric_api_version=0.158.0+26.2
